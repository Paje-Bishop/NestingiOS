openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Nest API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and session management
  - name: persons
    description: Person profile management
  - name: pregnancies
    description: Pregnancy management
  - name: invitations
    description: Invitation management
  - name: analytics
    description: Event tracking
  - name: journey
    description: Week-by-week pregnancy journey content
  - name: memories
    description: Member memories and journal entries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/send-code:
    post:
      operationId: sendVerificationCode
      tags: [auth]
      summary: Send a phone verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneInput"
      responses:
        "200":
          description: Code sent (stubbed in development)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSession"
        "400":
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-code:
    post:
      operationId: verifyCode
      tags: [auth]
      summary: Verify phone code and create or log in a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeVerification"
      responses:
        "200":
          description: Verified — returns session token and person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated person and their pregnancies
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current person with pregnancies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /persons/me:
    patch:
      operationId: updateMe
      tags: [persons]
      summary: Update the current person's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/mine:
    get:
      operationId: listMyPregnancies
      tags: [pregnancies]
      summary: List pregnancies the current person is a member of
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of pregnancy summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PregnancySummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies:
    post:
      operationId: createPregnancy
      tags: [pregnancies]
      summary: Create a new pregnancy and initial membership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregnancyInput"
      responses:
        "201":
          description: Created pregnancy and membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregnancyWithMembership"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{id}:
    get:
      operationId: getPregnancy
      tags: [pregnancies]
      summary: Get a pregnancy with members
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pregnancy detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PregnancyDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pregnancy not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePregnancy
      tags: [pregnancies]
      summary: Update a pregnancy's name or due date
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PregnancyUpdate"
      responses:
        "200":
          description: Updated pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pregnancy"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/invitations:
    post:
      operationId: createInvitation
      tags: [invitations]
      summary: Create an invitation for a pregnancy
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationInput"
      responses:
        "201":
          description: Created invitation with shareable link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationWithLink"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/{code}:
    get:
      operationId: getInvitation
      tags: [invitations]
      summary: Get invitation details by invite code (public)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationDetail"
        "404":
          description: Invitation not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/{code}/accept:
    post:
      operationId: acceptInvitation
      tags: [invitations]
      summary: Accept an invitation and join the pregnancy
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationAccept"
      responses:
        "200":
          description: Membership created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipResult"
        "400":
          description: Invalid state (e.g. already a member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invitations/{code}/decline:
    post:
      operationId: declineInvitation
      tags: [invitations]
      summary: Decline an invitation
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invitation declined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeclineResult"
        "404":
          description: Invitation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics:
    post:
      operationId: trackEvent
      tags: [analytics]
      summary: Track an analytics event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsInput"
      responses:
        "204":
          description: Event recorded

  /pregnancies/{pregnancyId}/journey/current:
    get:
      operationId: getCurrentJourneyWeek
      tags: [journey]
      summary: Get the current-week Journey view, role-aware, with the member's journal slot
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Current-week Journey view for the viewing member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCurrentWeek"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/journey/week/{weekNumber}:
    get:
      operationId: getJourneyWeek
      tags: [journey]
      summary: Browse a specific Journey week (past condensed, future preview) with its memories
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: weekNumber
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The requested week relative to the member's current week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyWeekView"
        "400":
          description: Invalid week or timing not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List memories visible to the member (own + others' public), newest first
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memories visible to the viewing member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Publish a memory — a journal reflection or a standalone photo
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A journal entry already exists for this week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/tasks:
    get:
      operationId: listTasks
      tags: [prepare]
      summary: List a pregnancy's Prepare tasks with viewer context for the task views
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tasks plus the viewing member's context for view filtering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrepareTasksView"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTask
      tags: [prepare]
      summary: Add a user-created task (isUserAdded is always true)
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/tasks/{taskId}:
    get:
      operationId: getTask
      tags: [prepare]
      summary: Get a single task's detail view
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTask
      tags: [prepare]
      summary: Update a task — toggle checklist, change status, reassign, or edit notes
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/decisions:
    get:
      operationId: listDecisions
      tags: [prepare]
      summary: List a pregnancy's Shared Decisions the member can see (all public, plus own private)
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shared decisions visible to the member
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SharedDecision"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createDecision
      tags: [prepare]
      summary: Open a new Shared Decision (defaults to Public)
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "201":
          description: Created shared decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDecisionDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this pregnancy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/decisions/{decisionId}:
    get:
      operationId: getDecision
      tags: [prepare]
      summary: Get a Shared Decision with its chronological contributions
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: decisionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shared decision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDecisionDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not visible to this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/decisions/{decisionId}/contributions:
    post:
      operationId: addContribution
      tags: [prepare]
      summary: Add an authored contribution (makes the member a contributor)
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: decisionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionInput"
      responses:
        "201":
          description: Decision detail with the new contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDecisionDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not visible to this member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/decisions/{decisionId}/close:
    post:
      operationId: closeDecision
      tags: [prepare]
      summary: Record the final decision and close it (contributors only)
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: decisionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseDecisionInput"
      responses:
        "200":
          description: Closed decision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDecisionDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only a contributor can close this decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pregnancies/{pregnancyId}/decisions/{decisionId}/reopen:
    post:
      operationId: reopenDecision
      tags: [prepare]
      summary: Reopen a closed decision (contributors only); history is preserved
      security:
        - bearerAuth: []
      parameters:
        - name: pregnancyId
          in: path
          required: true
          schema:
            type: integer
        - name: decisionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reopened decision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedDecisionDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only a contributor can reopen this decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Decision not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # ── Auth ──────────────────────────────────────────────────────────────────

    PhoneInput:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164 or 10-digit US phone number

    VerificationSession:
      type: object
      required: [verificationId]
      properties:
        verificationId:
          type: string

    CodeVerification:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
        code:
          type: string
          description: 6-digit OTP (any 6 digits accepted in development)

    AuthSession:
      type: object
      required: [token, person, isNewUser]
      properties:
        token:
          type: string
        person:
          $ref: "#/components/schemas/Person"
        isNewUser:
          type: boolean

    MeResponse:
      type: object
      required: [person, pregnancies]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        pregnancies:
          type: array
          items:
            $ref: "#/components/schemas/PregnancySummary"

    # ── Persons ───────────────────────────────────────────────────────────────

    Person:
      type: object
      required: [id, displayName, phone, createdAt, updatedAt]
      properties:
        id:
          type: integer
        displayName:
          type: string
        phone:
          type: string
        email:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonUpdate:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
        email:
          type: string

    # ── Pregnancies ───────────────────────────────────────────────────────────

    Pregnancy:
      type: object
      required: [id, name, dueDatePrecision, status, joinCode, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
        dueDatePrecision:
          type: string
          enum: [exact, approximate_month, unknown]
        status:
          type: string
        joinCode:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PregnancySummary:
      type: object
      required: [id, name, dueDatePrecision, status, joinCode, myRole, memberCount, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        dueDate:
          type: ["string", "null"]
          format: date
        dueDatePrecision:
          type: string
        status:
          type: string
        joinCode:
          type: string
        myRole:
          type: string
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    PregnancyInput:
      type: object
      required: [dueDatePrecision, role]
      properties:
        name:
          type: string
        dueDate:
          type: string
          format: date
        dueDatePrecision:
          type: string
          enum: [exact, approximate_month, unknown]
        role:
          type: string
          enum: [pregnant_person, supporter]

    PregnancyUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        dueDate:
          type: string
          format: date
        dueDatePrecision:
          type: string
          enum: [exact, approximate_month, unknown]

    Membership:
      type: object
      required: [id, personId, pregnancyId, role, invitationStatus, createdAt]
      properties:
        id:
          type: integer
        personId:
          type: integer
        pregnancyId:
          type: integer
        role:
          type: string
        invitationStatus:
          type: string
        createdAt:
          type: string
          format: date-time

    MemberSummary:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: integer
        displayName:
          type: string
        role:
          type: string

    PregnancyRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    PregnancyWithMembership:
      type: object
      required: [pregnancy, membership]
      properties:
        pregnancy:
          $ref: "#/components/schemas/Pregnancy"
        membership:
          $ref: "#/components/schemas/Membership"

    PregnancyDetail:
      type: object
      required: [pregnancy, members, myMembership]
      properties:
        pregnancy:
          $ref: "#/components/schemas/Pregnancy"
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberSummary"
        myMembership:
          $ref: "#/components/schemas/Membership"

    # ── Invitations ───────────────────────────────────────────────────────────

    Invitation:
      type: object
      required: [id, pregnancyId, inviteeName, inviteCode, status, sentAt, createdAt]
      properties:
        id:
          type: integer
        pregnancyId:
          type: integer
        inviteeName:
          type: string
        inviteePhone:
          type: ["string", "null"]
        inviteCode:
          type: string
        status:
          type: string
        sentAt:
          type: string
          format: date-time
        acceptedAt:
          type: ["string", "null"]
          format: date-time
        declinedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    InvitationInput:
      type: object
      required: [inviteeName]
      properties:
        inviteeName:
          type: string
          minLength: 1
        inviteePhone:
          type: string

    InvitationWithLink:
      type: object
      required: [invitation, joinUrl, joinCode]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        joinUrl:
          type: string
        joinCode:
          type: string

    InvitationDetail:
      type: object
      required: [invitation, pregnancy, inviterName, existingPregnantPerson]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        pregnancy:
          $ref: "#/components/schemas/PregnancyRef"
        inviterName:
          type: string
        existingPregnantPerson:
          type: boolean

    InvitationAccept:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [pregnant_person, supporter]

    MembershipResult:
      type: object
      required: [membership, pregnancy, convertedPreviousRole]
      properties:
        membership:
          $ref: "#/components/schemas/Membership"
        pregnancy:
          $ref: "#/components/schemas/Pregnancy"
        convertedPreviousRole:
          type: boolean

    DeclineResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # ── Analytics ─────────────────────────────────────────────────────────────

    AnalyticsInput:
      type: object
      required: [event]
      properties:
        event:
          type: string
        pregnancyId:
          type: integer
        properties:
          type: object
          additionalProperties: true

    # ── Journey ───────────────────────────────────────────────────────────────

    JourneyWeekContent:
      type: object
      required: [weekNumber, yourBaby, role]
      properties:
        weekNumber:
          type: integer
        yourBaby:
          type: string
          description: Shared baby-development content, identical for all roles
        milestones:
          type: ["string", "null"]
        commonExperiences:
          type: ["string", "null"]
        roleContent:
          type: ["string", "null"]
          description: Role-resolved framing (pregnant-person or supporter variant)
        isThisCommon:
          type: ["string", "null"]
        role:
          type: string
          description: The role used to resolve role-specific content
          enum: [pregnant_person, supporter]

    MemoryPromptOption:
      type: object
      required: [id, promptText]
      properties:
        id:
          type: integer
        promptText:
          type: string

    JournalSlot:
      type: object
      required: [published, eligiblePrompts]
      properties:
        published:
          type: boolean
          description: True once this member has published their journal entry for the week
        memory:
          oneOf:
            - $ref: "#/components/schemas/Memory"
            - type: "null"
        defaultPrompt:
          oneOf:
            - $ref: "#/components/schemas/MemoryPromptOption"
            - type: "null"
        eligiblePrompts:
          type: array
          description: The full eligible pool for the prompt picker
          items:
            $ref: "#/components/schemas/MemoryPromptOption"

    JourneyCurrentWeek:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: ok = week resolved; needs_due_date = no timing; approximate = month-only
          enum: [ok, needs_due_date, approximate]
        weekNumber:
          type: ["integer", "null"]
        content:
          oneOf:
            - $ref: "#/components/schemas/JourneyWeekContent"
            - type: "null"
        journal:
          oneOf:
            - $ref: "#/components/schemas/JournalSlot"
            - type: "null"

    JourneyWeekView:
      type: object
      required: [weekNumber, currentWeek, relation, locked, memories]
      properties:
        weekNumber:
          type: integer
        currentWeek:
          type: integer
          description: The member's resolved current week, for navigation bounds
        relation:
          type: string
          enum: [past, current, future]
        locked:
          type: boolean
          description: True for future weeks — role content, common experiences, and prompts are withheld
        content:
          oneOf:
            - $ref: "#/components/schemas/JourneyWeekContent"
            - type: "null"
        memories:
          type: array
          description: This week's memories — the viewer's own plus others' public (empty for future)
          items:
            $ref: "#/components/schemas/Memory"

    # ── Memories ──────────────────────────────────────────────────────────────

    Memory:
      type: object
      required: [id, pregnancyId, authorMembershipId, authorName, sourceType, visibility, createdAt, updatedAt]
      properties:
        id:
          type: integer
        pregnancyId:
          type: integer
        authorMembershipId:
          type: integer
        authorName:
          type: string
        sourceType:
          type: string
          enum: [manual, journey_prompt, shared_decision, milestone, task_completion, labor_update, birth_flow]
        text:
          type: ["string", "null"]
        photoUrls:
          type: ["array", "null"]
          items:
            type: string
        journeyWeekNumber:
          type: ["integer", "null"]
        promptLibraryItemId:
          type: ["integer", "null"]
        visibility:
          type: string
          enum: [private, public]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    MemoryInput:
      type: object
      required: [sourceType]
      properties:
        sourceType:
          type: string
          enum: [manual, journey_prompt]
        text:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        journeyWeekNumber:
          type: integer
          description: Required when sourceType is journey_prompt
        promptLibraryItemId:
          type: integer
          description: The pool prompt the member published; required when journey_prompt
        visibility:
          type: string
          enum: [private, public]
          description: Defaults by sourceType — journey_prompt = private, manual = public

    # ── Prepare: Tasks ────────────────────────────────────────────────────────

    ChecklistItem:
      type: object
      required: [id, label, done]
      properties:
        id:
          type: string
        label:
          type: string
        done:
          type: boolean

    Task:
      type: object
      required: [id, pregnancyId, title, taskType, status, isUserAdded, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: integer
        pregnancyId:
          type: integer
        title:
          type: string
        whyNow:
          type: ["string", "null"]
        whyItMatters:
          type: ["string", "null"]
        checklist:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ChecklistItem"
        prompts:
          type: ["string", "null"]
        taskType:
          type: string
          enum: [mine_only, assigned, together]
        status:
          type: string
          enum: [not_started, in_progress, completed]
        assignedMemberId:
          type: ["integer", "null"]
        assignedMemberName:
          type: ["string", "null"]
        dueWeek:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        isUserAdded:
          type: boolean
        relatedSharedDecisionId:
          type: ["integer", "null"]
        sortOrder:
          type: integer
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PrepareMember:
      type: object
      required: [membershipId, personName, role]
      properties:
        membershipId:
          type: integer
        personName:
          type: string
        role:
          type: string
          enum: [pregnant_person, supporter]

    PrepareTasksView:
      type: object
      required: [viewerMembershipId, viewerRole, hasPregnantPerson, members, tasks]
      properties:
        viewerMembershipId:
          type: integer
        viewerRole:
          type: string
          enum: [pregnant_person, supporter]
        hasPregnantPerson:
          type: boolean
          description: False when no member holds the Pregnant Person role — Mine Only tasks are held back
        members:
          type: array
          items:
            $ref: "#/components/schemas/PrepareMember"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        whyNow:
          type: string
        whyItMatters:
          type: string
        taskType:
          type: string
          enum: [mine_only, assigned, together]
          description: Defaults to together when omitted
        assignedMemberId:
          type: integer
        dueWeek:
          type: integer
        notes:
          type: string
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"

    TaskUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [not_started, in_progress, completed]
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        notes:
          type: string
        assignedMemberId:
          type: ["integer", "null"]
          description: Reassign to an active member, or null to unassign

    # ── Prepare: Shared Decisions ─────────────────────────────────────────────

    DecisionContribution:
      type: object
      required: [id, sharedDecisionId, authorMembershipId, authorName, body, createdAt]
      properties:
        id:
          type: integer
        sharedDecisionId:
          type: integer
        authorMembershipId:
          type: integer
        authorName:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    SharedDecision:
      type: object
      required: [id, pregnancyId, title, status, visibility, createdByMembershipId, contributionCount, viewerIsContributor, createdAt, updatedAt]
      properties:
        id:
          type: integer
        pregnancyId:
          type: integer
        title:
          type: string
        prompt:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, decision_recorded, closed]
        visibility:
          type: string
          enum: [public, private]
        finalDecision:
          type: ["string", "null"]
        finalRationale:
          type: ["string", "null"]
        closedByMembershipId:
          type: ["integer", "null"]
        closedAt:
          type: ["string", "null"]
          format: date-time
        relatedTaskId:
          type: ["integer", "null"]
        createdByMembershipId:
          type: integer
        contributionCount:
          type: integer
        viewerIsContributor:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SharedDecisionDetail:
      allOf:
        - $ref: "#/components/schemas/SharedDecision"
        - type: object
          required: [contributions]
          properties:
            contributions:
              type: array
              items:
                $ref: "#/components/schemas/DecisionContribution"

    DecisionInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        prompt:
          type: string
        visibility:
          type: string
          enum: [public, private]
          description: Defaults to public
        relatedTaskId:
          type: integer

    ContributionInput:
      type: object
      required: [body]
      properties:
        body:
          type: string

    CloseDecisionInput:
      type: object
      required: [finalDecision]
      properties:
        finalDecision:
          type: string
        finalRationale:
          type: string
